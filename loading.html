<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>تحداك</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
        }
        #appLoader {
            position: fixed;
            inset: 0;
            background: #0b0b0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        .loaderLogo {
            font-size: 45px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .loaderText {
            font-size: 17px;
            color: #aaa;
            margin-bottom: 25px;
        }
        .loaderCircle {
            width: 45px;
            height: 45px;
            border: 4px solid #333;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div id="appLoader">
        <div class="loaderLogo">
            🎮 تحداك
        </div>
        <div class="loaderText">
            جاري التحميل...
        </div>
        <div class="loaderCircle"></div>
    </div>
    <script>
        setTimeout(function () {
            window.location.href = "home.html";
        }, 1500);
    </script>
</body>
</html>
