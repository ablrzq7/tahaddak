<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحداك - الاختبار</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0b0f;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:90%;
    max-width:500px;
    margin:auto;
    padding:25px 0;
}

.header{
    text-align:center;
    margin-bottom:25px;
    animation:fadeDown .5s ease;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    color:#aaa;
    margin-top:8px;
}

.questionInfo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    color:#aaa;
    font-size:14px;
}

.progressBox{
    width:100%;
    height:8px;
    background:#24242b;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.progress{
    height:100%;
    width:0%;
    background:white;
    border-radius:20px;
    transition:width .4s ease;
}

.question{
    background:#15151b;
    padding:25px 18px;
    border-radius:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:18px;
    animation:questionIn .4s ease;
}

.answers{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.answer{
    width:100%;
    border:none;
    padding:17px;
    border-radius:14px;
    background:#1b1b22;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.2s;
}

.answer:hover{
    transform:translateY(-2px);
    background:#25252d;
}

.answer:active{
    transform:scale(.97);
}

.answer.correct{
    background:#168a45;
    animation:correct .4s ease;
}

.answer.wrong{
    background:#a52b35;
    animation:wrong .4s ease;
}

.result{
    display:none;
    text-align:center;
    animation:resultIn .6s ease;
}

.result h2{
    font-size:32px;
}

.score{
    font-size:55px;
    font-weight:bold;
    margin:20px 0;
}

.reward{
    background:#15151b;
    border-radius:16px;
    padding:18px;
    margin:15px 0;
    font-size:18px;
}

.achievement{
    display:none;
    background:#17170f;
    border:1px solid #6f651e;
    border-radius:16px;
    padding:18px;
    margin:15px 0;
    animation:achievement .7s ease;
}

.result button{
    border:none;
    width:100%;
    padding:16px;
    border-radius:14px;
    margin-top:10px;
    font-size:17px;
    cursor:pointer;
    background:white;
    color:#111;
}

.homeBtn{
    background:#222 !important;
    color:white !important;
}

.confetti{
    position:fixed;
    top:-20px;
    font-size:25px;
    z-index:9999;
    pointer-events:none;
    animation:fall 2.5s linear forwards;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes questionIn{
    from{
        opacity:0;
        transform:translateX(30px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes correct{
    0%{transform:scale(1)}
    50%{transform:scale(1.04)}
    100%{transform:scale(1)}
}

@keyframes wrong{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-7px)}
    50%{transform:translateX(7px)}
    75%{transform:translateX(-5px)}
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes achievement{
    from{
        opacity:0;
        transform:scale(.6);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎯 تحداك</h1>
        <p>اختبر معلوماتك</p>
    </div>

    <div id="quiz">

        <div class="questionInfo">
            <span id="questionNumber">السؤال 1 من 10</span>
            <span id="scoreText">النقاط: 0</span>
        </div>

        <div class="progressBox">
            <div class="progress" id="progress"></div>
        </div>

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

    </div>

    <div class="result" id="result">

        <h2>🏆 انتهى التحدي!</h2>

        <div class="score" id="finalScore">
            0 / 10
        </div>

        <p id="resultMessage"></p>

        <div class="reward" id="reward">
            ⭐ حصلت على 0 نقطة
        </div>

        <div class="achievement" id="achievement">
            🏆 <strong>إنجاز جديد!</strong>
            <br>
            أسطورة التحدي — حصلت على 10/10 🔥
        </div>

        <button onclick="restartQuiz()">
            🔄 إعادة الاختبار
        </button>

        <button class="homeBtn"
                onclick="location.href='home.html'">
            🏠 العودة للرئيسية
        </button>

    </div>

</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyCzLovBsbbmHYnTPYLdY1XVRws2oKnnfH",
    authDomain: "tahaddak-852c1.firebaseapp.com",
    projectId: "tahaddak-852c1",
    storageBucket: "tahaddak-852c1.firebasestorage.app",
    messagingSenderId: "518864619958",
    appId: "1:518864619958:web:d91dc152134c9d81255917",
    measurementId: "G-KQP0VXV27Q"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* الأسئلة */

const questions = [

    {
        q:"ما هي عاصمة المملكة العربية السعودية؟",
        answers:["جدة","الرياض","مكة","الدمام"],
        correct:1
    },

    {
        q:"كم عدد أيام الأسبوع؟",
        answers:["5","6","7","8"],
        correct:2
    },

    {
        q:"ما هو أكبر كوكب في المجموعة الشمسية؟",
        answers:["الأرض","المريخ","زحل","المشتري"],
        correct:3
    },

    {
        q:"كم عدد قارات العالم؟",
        answers:["5","6","7","8"],
        correct:2
    },

    {
        q:"من يُعرف بملك الغابة؟",
        answers:["النمر","الأسد","الفهد","الدب"],
        correct:1
    },

    {
        q:"ما هو الكوكب المعروف بالكوكب الأحمر؟",
        answers:["الزهرة","المريخ","عطارد","نبتون"],
        correct:1
    },

    {
        q:"كم عدد ألوان قوس قزح؟",
        answers:["5","6","7","8"],
        correct:2
    },

    {
        q:"ما هي عاصمة مصر؟",
        answers:["القاهرة","الإسكندرية","الجيزة","أسوان"],
        correct:0
    },

    {
        q:"ما هو أسرع حيوان بري؟",
        answers:["الأسد","الفهد","الحصان","النمر"],
        correct:1
    },

    {
        q:"كم عدد الصلوات المفروضة في اليوم والليلة؟",
        answers:["3","4","5","6"],
        correct:2
    }

];


let currentQuestion = 0;
let score = 0;
let answered = false;

const playerName =
    localStorage.getItem("playerName") || "لاعب";


function showQuestion(){

    answered = false;

    const question = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `السؤال ${currentQuestion + 1} من ${questions.length}`;

    document.getElementById("scoreText").textContent =
        `النقاط: ${score}`;

    document.getElementById("progress").style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

    const questionBox =
        document.getElementById("question");

    questionBox.style.animation = "none";

    setTimeout(()=>{
        questionBox.style.animation =
            "questionIn .4s ease";
    },10);

    questionBox.textContent = question.q;

    const answersBox =
        document.getElementById("answers");

    answersBox.innerHTML = "";

    question.answers.forEach((answer,index)=>{

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = ()=>{
            checkAnswer(button,index);
        };

        answersBox.appendChild(button);

    });

}


function checkAnswer(button,index){

    if(answered) return;

    answered = true;

    const question = questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(btn=>{
        btn.disabled = true;
    });


    if(index === question.correct){

        button.classList.add("correct");

        score++;

    }else{

        button.classList.add("wrong");

        buttons[question.correct]
            .classList.add("correct");

    }


    document.getElementById("scoreText").textContent =
        `النقاط: ${score}`;


    setTimeout(()=>{

        currentQuestion++;

        if(currentQuestion < questions.length){

            showQuestion();

        }else{

            finishQuiz();

        }

    },700);

}


/* حساب مكافأة الاختبار */

function calculateReward(){

    return score * 10;

}


/* تحديث النقاط والستريك */

function updatePlayerStats(){

    const reward = calculateReward();

    let points =
        Number(localStorage.getItem("points")) || 0;

    let streak =
        Number(localStorage.getItem("streak")) || 0;

    let completed =
        Number(localStorage.getItem("completed")) || 0;


    points += reward;

    completed++;


    /*
      نزيد الستريك عند إنهاء الاختبار.
      ونحفظ آخر تاريخ اختبار حتى ما يتكرر
      الستريك بشكل مبالغ فيه.
    */

    const today =
        new Date().toDateString();

    const lastQuiz =
        localStorage.getItem("lastQuizDate");


    if(lastQuiz !== today){

        streak++;

        localStorage.setItem(
            "lastQuizDate",
            today
        );

    }


    localStorage.setItem(
        "points",
        points
    );

    localStorage.setItem(
        "streak",
        streak
    );

    localStorage.setItem(
        "completed",
        completed
    );


    return {
        reward,
        points,
        streak,
        completed
    };

}


/* الاحتفال */

function createConfetti(){

    const symbols = [
        "🎉",
        "⭐",
        "🏆",
        "🔥"
    ];

    for(let i=0;i<30;i++){

        const item =
            document.createElement("div");

        item.className = "confetti";

        item.textContent =
            symbols[Math.floor(
                Math.random() * symbols.length
            )];

        item.style.left =
            Math.random() * 100 + "%";

        item.style.animationDelay =
            Math.random() * 1 + "s";

        document.body.appendChild(item);

        setTimeout(()=>{
            item.remove();
        },3500);

    }

}


/* إنهاء الاختبار */

async function finishQuiz(){

    document.getElementById("quiz").style.display =
        "none";

    const result =
        document.getElementById("result");

    result.style.display =
        "block";


    document.getElementById("finalScore")
        .textContent =
        `${score} / ${questions.length}`;


    let message = "";

    if(score === 10){

        message =
            "🔥 أسطوري! جبت الدرجة الكاملة!";

        createConfetti();

    }else if(score >= 8){

        message =
            "🏆 ممتاز جدًا! معلوماتك قوية.";

    }else if(score >= 6){

        message =
            "👏 ممتاز! أداء حلو.";

    }else if(score >= 4){

        message =
            "💪 جيد، حاول تحسن نتيجتك.";

    }else{

        message =
            "😎 لا تستسلم، جرب مرة ثانية!";

    }


    document.getElementById("resultMessage")
        .textContent = message;


    /* تحديث الإحصائيات */

    const stats =
        updatePlayerStats();


    document.getElementById("reward")
        .textContent =
        `⭐ حصلت على ${stats.reward} نقطة`;


    /* إنجاز الدرجة الكاملة */

    if(score === 10){

        const achievement =
            document.getElementById("achievement");

        achievement.style.display =
            "block";

        localStorage.setItem(
            "perfectQuiz",
            "yes"
        );

    }


    /* حفظ النتيجة في Firebase */

    try{

        await addDoc(
            collection(db,"quizResults"),
            {
                playerName: playerName,

                playerCode:
                    localStorage.getItem("playerCode") || "",

                score: score,

                total: questions.length,

                reward: stats.reward,

                createdAt:
                    serverTimestamp()
            }
        );

    }catch(error){

        console.error(
            "خطأ في حفظ النتيجة:",
            error
        );

    }

}


/* إعادة الاختبار */

window.restartQuiz = function(){

    currentQuestion = 0;

    score = 0;

    document.getElementById("result")
        .style.display = "none";

    document.getElementById("quiz")
        .style.display = "block";

    showQuestion();

};


showQuestion();

</script>

</body>
</html>
